  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curso JS + Ionic</title>
    <link rel="icon" type="image/png" href="./assets/favicon/favicon.png" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css"
    />
    <link rel="stylesheet" href="./src/app/themes.css" />
    <link rel="stylesheet" href="./src/app/styles.css" />

    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>

  </head>

  <body>
    <ion-app>
      <ion-header translucent="true">
        <ion-toolbar>
          <ion-buttons slot="start">
            <img src="./assets/images/logo.png" alt="Logo" style="height:36px;margin-left:8px;border-radius:6px;" />
          </ion-buttons>
          <ion-title>Curso JavaScript Avanzado e Ionic</ion-title>
          <ion-buttons slot="end">
            <span style="font-size:12px;margin-right:4px;color:var(--ion-toolbar-color,#fff);" id="theme-label">Claro</span>
            <ion-toggle id="theme-toggle" aria-label="Modo oscuro" style="margin-right:8px;"></ion-toggle>
          </ion-buttons>
        </ion-toolbar>
        <ion-toolbar>
          <ion-segment value="home" id="top-nav">
            <ion-segment-button value="home">
              <ion-label>Inicio</ion-label>
            </ion-segment-button>
            <ion-segment-button value="js">
              <ion-label>JS</ion-label>
            </ion-segment-button>
            <ion-segment-button value="ionic">
              <ion-label>Ionic</ion-label>
            </ion-segment-button>
            <ion-segment-button value="docs">
              <ion-label>Documentación</ion-label>
            </ion-segment-button>
          </ion-segment>
        </ion-toolbar>
      </ion-header>

      <ion-content fullscreen="true">
        <main id="app" class="app-shell"></main>
      </ion-content>
