<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curso JS + Ionic</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css"
    />
    <link rel="stylesheet" href="./src/app/styles.css" />

    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  </head>

  <body>
    <ion-app>
      <ion-header translucent="true">
        <ion-toolbar>
          <ion-title>Curso JavaScript Avanzado e Ionic</ion-title>
        </ion-toolbar>
        <ion-toolbar>
          <ion-segment value="home" id="top-nav">
            <ion-segment-button value="home">
              <ion-label>Inicio</ion-label>
            </ion-segment-button>
            <ion-segment-button value="js">
              <ion-label>JS</ion-label>
            </ion-segment-button>
            <ion-segment-button value="ionic">
              <ion-label>Ionic</ion-label>
            </ion-segment-button>
            <ion-segment-button value="docs">
              <ion-label>Markdown</ion-label>
            </ion-segment-button>
          </ion-segment>
        </ion-toolbar>
      </ion-header>

      <ion-content fullscreen="true">
        <main id="app" class="app-shell"></main>
      </ion-content>
    </ion-app>

    <script type="module" src="./src/app/main.js"></script>
  </body>
</html>
